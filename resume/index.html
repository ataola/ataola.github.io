:root{
  --paper:#f6f2e8; --paper-2:#fbf8f0; --ink:#17140f; --ink-2:#3a342b;
  --muted:#6d6557; --rule:#d9d1bf; --rule-strong:#b3a88f; --seal:#9c1f16;
  --serif:Georgia,"Songti SC","Noto Serif SC","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans","Noto Sans KR","Microsoft YaHei",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.6}

/* ---------- 工具条 ---------- */
.toolbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:10px clamp(14px,4vw,28px);background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:saturate(1.2) blur(6px);border-bottom:1px solid var(--rule)}
.langs{display:flex;gap:4px}
.langs button{font:inherit;font-size:12.5px;letter-spacing:.06em;color:var(--ink-2);background:transparent;
  border:1px solid var(--rule-strong);padding:5px 10px;cursor:pointer}
.langs button:hover{border-color:var(--ink);color:var(--ink)}
.langs button.active{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.print{font:inherit;font-size:12.5px;letter-spacing:.06em;color:var(--paper);background:var(--seal);border:1px solid var(--seal);
  padding:6px 14px;cursor:pointer}
.print:hover{filter:brightness(1.08)}

/* ---------- 纸张 ---------- */
.sheet{max-width:820px;margin:clamp(16px,3vw,34px) auto 60px;padding:clamp(22px,4.5vw,52px);
  background:var(--paper-2);border:1px solid var(--rule);
  box-shadow:0 1px 0 rgba(23,20,15,.05),0 18px 50px -30px rgba(23,20,15,.35)}

/* ---------- 头部 ---------- */
.rhead{padding-bottom:18px;border-bottom:3px double var(--ink)}
.rname{font-family:var(--serif);font-weight:700;font-size:clamp(28px,5vw,42px);letter-spacing:.03em;line-height:1.15;margin:0}
.rtitle{margin:7px 0 0;font-size:14.5px;letter-spacing:.04em;color:var(--seal);font-weight:600}
.rcontact{margin-top:12px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2);letter-spacing:.02em}
.rcontact a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--rule-strong)}
.rcontact a:hover{color:var(--seal);border-color:var(--seal)}
.rcontact .dot{color:var(--rule-strong)}

/* ---------- 段落 ---------- */
.sec{margin-top:30px}
.sec>h2{margin:0 0 14px;font-size:11.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
  color:var(--seal);padding-bottom:6px;border-bottom:1px solid var(--rule)}
.summary{font-size:14px;line-height:1.9;color:var(--ink);margin:0}

/* 技能 */
.skills{display:grid;gap:9px;margin:0}
.skill{display:grid;grid-template-columns:120px 1fr;gap:14px;font-size:13.5px}
.skill .k{color:var(--muted);font-size:12.5px;letter-spacing:.03em;padding-top:1px}
.skill .v{color:var(--ink)}

/* 经历 */
.job{padding-bottom:20px;margin-bottom:20px;border-bottom:1px dashed var(--rule)}
.job:last-child{border-bottom:0;padding-bottom:0;margin-bottom:0}
.job .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.job .co{font-family:var(--serif);font-weight:700;font-size:15.5px}
.job .pd{font-size:12px;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
.job .ro{margin-top:3px;font-size:13.5px;color:var(--seal)}
.job .nt{margin-top:7px;font-size:13px;line-height:1.75;color:var(--ink-2)}
.job ul{margin:9px 0 0;padding:0;list-style:none}
.job li{position:relative;padding-left:15px;font-size:13.5px;line-height:1.85;color:var(--ink)}
.job li::before{content:"·";position:absolute;left:2px;color:var(--seal);font-weight:700}

/* 教育 */
.edu .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.edu .sc{font-family:var(--serif);font-weight:700;font-size:15.5px}
.edu .pd{font-size:12px;color:var(--muted);white-space:nowrap}
.edu .mj{margin-top:3px;font-size:13.5px;color:var(--ink-2)}

.rfoot{margin-top:34px;padding-top:14px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--muted);text-align:center;letter-spacing:.08em}

@media(max-width:560px){
  .skill{grid-template-columns:1fr;gap:2px}
  .rcontact{font-size:12px}
}

/* ---------- 打印 ---------- */
@page{size:A4;margin:14mm}
@media print{
  :root{--paper:#fff;--paper-2:#fff}
  body{background:#fff;font-size:12.5px}
  .toolbar{display:none!important}
  .sheet{max-width:none;margin:0;padding:0;border:0;box-shadow:none}
  .sec{margin-top:15px}
  .sec>h2{break-after:avoid;page-break-after:avoid}
  .rhead{break-inside:avoid;page-break-inside:avoid}
  .job,.edu{break-inside:avoid;page-break-inside:avoid}
  .job ul,.summary{orphans:3;widows:3}
  .rname{font-size:28px}
  .rfoot{display:none}
  a{color:var(--ink)!important;border:0!important}
}
</style>
</head>

<script>
(function(){
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var ORDER = ['zh','en','ja','ko'];
  var langTag = { zh:'zh-CN', en:'en', ja:'ja', ko:'ko' };

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function render(code){
    var d = DATA[code]; if(!d) return;
    var mail = 'mailto:' + d.email;
    var html = '';
    html += '<header class="rhead">';
    html += '<h1 class="rname">' + esc(d.name) + '</h1>';
    html += '<p class="rtitle">' + esc(d.title) + '</p>';
    html += '<div class="rcontact">';
    html += '<span>' + esc(d.location) + '</span>';
    html += '<span class="dot">·</span><a href="' + esc(mail) + '">' + esc(d.email) + '</a>';
    html += '<span class="dot">·</span><a href="https://' + esc(d.github) + '" target="_blank" rel="noopener">' + esc(d.github) + '</a>';
    html += '<span class="dot">·</span><a href="https://' + esc(d.website) + '" target="_blank" rel="noopener">' + esc(d.website) + '</a>';
    html += '</div></header>';

    html += '<section class="sec"><h2>' + esc(d.summaryTitle) + '</h2><p class="summary">' + esc(d.summary) + '</p></section>';

    html += '<section class="sec"><h2>' + esc(d.skillsTitle) + '</h2><div class="skills">';
    d.skills.forEach(function(s){ html += '<div class="skill"><span class="k">' + esc(s.k) + '</span><span class="v">' + esc(s.v) + '</span></div>'; });
    html += '</div></section>';

    html += '<section class="sec"><h2>' + esc(d.expTitle) + '</h2>';
    d.jobs.forEach(function(j){
      html += '<article class="job"><div class="top"><span class="co">' + esc(j.co) + '</span><span class="pd">' + esc(j.pd) + '</span></div>';
      html += '<p class="ro">' + esc(j.ro) + '</p>';
      if(j.nt) html += '<p class="nt">' + esc(j.nt) + '</p>';
      html += '<ul>';
      j.b.forEach(function(x){ html += '<li>' + esc(x) + '</li>'; });
      html += '</ul></article>';
    });
    html += '</section>';

    html += '<section class="sec"><h2>' + esc(d.eduTitle) + '</h2>';
    d.edu.forEach(function(e){
      html += '<div class="edu"><div class="top"><span class="sc">' + esc(e.s) + '</span><span class="pd">' + esc(e.p) + '</span></div>';
      html += '<p class="mj">' + esc(e.d) + ' · ' + esc(e.m) + '</p></div>';
    });
    html += '</section>';

    html += '<div class="rfoot">' + esc(d.name) + ' · ' + esc(d.email) + '</div>';

    document.getElementById('sheet').innerHTML = html;
    document.getElementById('print').textContent = d.print;
    document.documentElement.lang = langTag[code] || 'zh-CN';
    document.title = d.name + ' — ' + d.title;
    document.querySelectorAll('#langs button').forEach(function(b){ b.classList.toggle('active', b.dataset.lang === code); });
    try { localStorage.setItem('resume-lang', code); } catch(e){}
  }

  var langs = document.getElementById('langs');
  ORDER.forEach(function(code){
    var b = document.createElement('button');
    b.textContent = DATA[code].label; b.dataset.lang = code;
    b.addEventListener('click', function(){ render(code); });
    langs.appendChild(b);
  });

  document.getElementById('print').addEventListener('click', function(){ window.print(); });

  var saved;
  try { saved = localStorage.getItem('resume-lang'); } catch(e){}
  if(!saved || ORDER.indexOf(saved) < 0){
    var nav = (navigator.languages && navigator.languages[0] || navigator.language || '').toLowerCase();
    saved = nav.indexOf('ja') === 0 ? 'ja' : nav.indexOf('ko') === 0 ? 'ko' : nav.indexOf('en') === 0 ? 'en' : 'zh';
  }
  render(saved);
})();
</script>
</body>
</html>
